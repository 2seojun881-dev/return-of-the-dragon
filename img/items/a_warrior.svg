 <pattern id="scale" width="12" height="10" patternUnits="userSpaceOnUse"><path d="M0 0 Q6 10 12 0" fill="#1c1f26" stroke="#5a2a22" stroke-width="1.4"/><path d="M-6 5 Q0 15 6 5 M6 5 Q12 15 18 5" fill="#1c1f26" stroke="#5a2a22" stroke-width="1.4"/></pattern>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".6"/></filter>
