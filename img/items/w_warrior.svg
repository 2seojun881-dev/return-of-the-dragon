  <path d="M125 40h6l-3 7z M124 56h8v2h-8z M126 64l4 6-4 6z M123 86l10 4-10 4z M126 104h4v10h-4z M123 124l5-6 5 6-5 6z M125 142h6l-3 8z"/>
 </g>
 <!-- crossguard: dragon bone with teeth -->
 <path d="M72 166 Q128 150 184 166 L178 184 Q128 172 78 184 Z" fill="url(#bone)" stroke="#5a4a36" stroke-width="2"/>
 <path d="M72 166 L60 158 L70 176 Z M184 166 L196 158 L186 176 Z" fill="url(#bone)" stroke="#5a4a36" stroke-width="1.5"/>
 <path d="M88 180 l4 10 l4 -9 M104 178 l4 11 l4 -10 M144 178 l4 11 l4 -10 M160 180 l4 10 l4 -9" fill="#efe3c8" stroke="#6a5a40" stroke-width="1.2"/>
 <circle cx="128" cy="170" r="9" fill="url(#gold)" stroke="#5a3a08" stroke-width="2"/>
 <circle cx="128" cy="170" r="4.5" fill="#ff2a10" filter="url(#glow)"/>
 <!-- grip -->
 <rect x="120" y="184" width="16" height="44" rx="3" fill="#3a1a12"/>
 <path d="M120 188 l16 6 M120 196 l16 6 M120 204 l16 6 M120 212 l16 6 M120 220 l16 6" stroke="#7a3a22" stroke-width="3"/>
 <!-- pommel: dragon eye -->
 <path d="M128 226 L142 236 L128 252 L114 236 Z" fill="url(#gold)" stroke="#5a3a08" stroke-width="2"/>
 <ellipse cx="128" cy="237" rx="5" ry="3" fill="#ffd23a" filter="url(#glow)"/><rect x="127" y="234" width="2" height="6" fill="#200"/>
</g>
</svg>
