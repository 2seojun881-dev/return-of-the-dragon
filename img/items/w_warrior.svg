<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
 <linearGradient id="bl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16181d"/><stop offset=".45" stop-color="#4a4f5a"/><stop offset=".55" stop-color="#2a2d34"/><stop offset="1" stop-color="#0c0d10"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa3b3"/><stop offset="1" stop-color="#5a6070"/></linearGradient>
 <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e6cf"/><stop offset="1" stop-color="#a8977a"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset=".5" stop-color="#c8902a"/><stop offset="1" stop-color="#7a4e10"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".6"/></filter>
</defs>
<g transform="rotate(45 128 128)" filter="url(#sh)">
 <!-- blade -->
 <path d="M128 6 L145 30 L145 168 L111 168 L111 30 Z" fill="url(#bl)"/>
 <path d="M128 6 L145 30 L145 168 L140 168 L140 32 L128 14 Z" fill="url(#edge)" opacity=".85"/>
 <path d="M128 6 L111 30 L111 168 L116 168 L116 32 L128 14 Z" fill="#6a7080" opacity=".6"/>
 <path d="M126 28 L130 28 L130 160 L126 160 Z" fill="#0a0506"/>
