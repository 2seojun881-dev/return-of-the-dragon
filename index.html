<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>용의 귀환</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0c0a0d;--panel:rgba(24,18,21,.92);--panel2:rgba(44,33,32,.95);--line:#7a5d3a;--line2:#3c2e26;
  --text:#f1e8d6;--dim:#a99d8a;--gold:#dcb65e;--ember:#e8743b;--hp:#c8453b;--hp2:#5c1714;--exp:#6db0d8;
  --ok:#79c46e;--warn:#e0a53c;--bad:#d9544a;--ice:#8fd0f5;--violet:#a98be0;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.5 'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.disp{font-family:'Gowun Batang','Nanum Myeongjo',serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}
[hidden]{display:none!important}

/* world labels */
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 75% 70% at 50% 48%,transparent 52%,rgba(6,4,10,.38) 80%,rgba(4,2,8,.72) 100%)}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.tag{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;font-size:11px;line-height:1.25;text-shadow:0 1px 2px #000,0 0 3px #000;will-change:transform}
.tag .nm{display:block}
.tag .nm small{color:var(--dim);font-size:10px}
.tag.npc .nm{color:#f6e2a8}
.tag .sub{display:block;font-size:10px;color:#cdbf9f}
.tag .qm{display:none;font:700 24px/1 'Gowun Batang',serif;color:var(--gold);animation:bob .8s ease-in-out infinite alternate}
.tag.hasq .qm{display:block}
.tag.en .nm{color:#f2b4a6}
.tag.en .nm,.tag.en .hpb{visibility:hidden}
.tag.en.show .nm,.tag.en.show .hpb{visibility:visible}
.tag .hpb{display:block;width:54px;height:5px;margin:2px auto 0;background:#2a1414;border:1px solid #000}
.tag .hpb i{display:block;height:100%;background:var(--hp);width:100%}
.tag.boss .nm{color:#ff8f6b;font-weight:700}
@keyframes bob{to{transform:translateY(-6px)}}
.dmg{position:absolute;left:0;top:0;font:700 17px 'IBM Plex Sans KR',sans-serif;color:#fff;text-shadow:0 2px 0 #000,0 0 5px #000;pointer-events:none;white-space:nowrap}
.dmg.crit{color:#ffd35a;font-size:23px}
.dmg.hurt{color:#ff7466}
.dmg.heal{color:#8ef08a}
.dmg.info{color:#a8dcff;font-size:13px}
.dmg.lvl{color:var(--gold);font:700 22px 'Gowun Batang',serif}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#pbox{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(18,13,15,.85),rgba(18,13,15,.35));border:1px solid var(--line2);border-radius:44px 10px 10px 44px;padding:5px 14px 6px 5px;min-width:220px}
#portrait{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a3a30,#1a1214);border:2px solid var(--line);display:grid;place-items:center;color:var(--gold);flex:none}
#portrait svg{width:28px;height:28px}
#pinfo{flex:1;min-width:0}
#pname{font:700 13px 'Gowun Batang',serif;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
#pname .lv{color:var(--gold)}
#ptitle{font:12px 'IBM Plex Sans KR';color:var(--warn)}
.bar{position:relative;height:12px;background:var(--hp2);border:1px solid #000;border-radius:2px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;inset:0;background:linear-gradient(#e0574b,#a3312a);transform-origin:left;transition:transform .15s}
.bar span{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;text-shadow:0 1px 1px #000}
.bar.exp{height:5px;background:#12222c;margin-top:3px}
.bar.exp i{background:linear-gradient(#8cd0f2,#4a8fb8)}
#gold{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(80px + env(safe-area-inset-top,0px));font-size:12px;color:var(--gold);background:rgba(18,13,15,.6);padding:2px 10px;border-radius:10px;display:flex;gap:10px}
#gold b{font-weight:500}
#gold .dia{color:#9fd8ff}

#qtrack{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(112px + env(safe-area-inset-top,0px));width:min(250px,44vw);background:linear-gradient(90deg,rgba(18,13,15,.82),rgba(18,13,15,.2));border-left:3px solid var(--gold);padding:8px 10px;text-align:left;border-radius:0 8px 8px 0}
#qtrack .qh{font-size:10px;letter-spacing:.12em;color:var(--gold)}
#qtitle{font:700 14px 'Gowun Batang',serif;margin:1px 0 4px}
#qgoals div{font-size:12px;color:#e8dcc4;display:flex;justify-content:space-between;gap:6px}
#qgoals div.done{color:var(--ok)}
#qgoals .note{color:var(--dim);font-size:11px}
#qtrack .qhint{font-size:10px;color:var(--dim);margin-top:4px}
#qtrack.pulse{animation:qp 1s ease 2}
@keyframes qp{50%{background:rgba(220,182,94,.3)}}

#tr{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mmwrap{position:relative;width:132px;height:132px;border-radius:50%;border:2px solid var(--line);overflow:hidden;background:#15110f;box-shadow:0 0 0 3px rgba(0,0,0,.4)}
#mm{width:100%;height:100%}
#zname{font:700 12px 'Gowun Batang',serif;color:#f3e3bb;text-shadow:0 1px 2px #000;text-align:right}
#trbtns{display:flex;gap:6px}
.rbtn{width:44px;height:44px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:#eadcc0;position:relative}
.rbtn svg{width:22px;height:22px}
.rbtn.pulse::after{content:'';position:absolute;inset:-4px;border:2px solid var(--gold);border-radius:12px;animation:ring 1s ease-out infinite}
@keyframes ring{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}

#skills{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:290px;height:220px}
.sk{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 35%,#4b3a2e,#1b1412 70%);border:2px solid var(--line);display:grid;place-items:center;color:#f4e2bb;box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 0 12px rgba(0,0,0,.6);overflow:hidden}
.sk svg{width:44%;height:44%;position:relative;z-index:1}
.sk:active{transform:scale(.94)}
.sk .cdv{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p,0)*1turn),transparent 0);z-index:2;pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:grid;place-items:center;font:700 16px 'IBM Plex Sans KR';z-index:3;text-shadow:0 1px 2px #000;pointer-events:none}
.sk .lock{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,8,8,.8);z-index:4;font-size:11px;color:var(--dim);flex-direction:column}
.sk.locked .lock{display:grid}
.sk.ready{border-color:var(--gold)}
.sk.big{width:88px;height:88px;right:0;bottom:0;border-width:3px;background:radial-gradient(circle at 50% 35%,#6b3b28,#23130f 72%)}
.sk.s{width:60px;height:60px}
.sk.u{width:66px;height:66px;background:radial-gradient(circle at 50% 35%,#5a2f5c,#1a1020 72%);border-color:#8f6aa0}
#b-s1{right:98px;bottom:0}
#b-s2{right:90px;bottom:68px}
#b-s3{right:24px;bottom:100px}
#b-ult{right:164px;bottom:14px}
.sk .pas{position:absolute;left:0;right:0;bottom:6px;font:700 9px 'IBM Plex Sans KR';color:#ffe0a0;z-index:3;text-align:center;letter-spacing:.05em}
.sk.passive{border-style:dashed;border-color:#b8904a}
.sk .lock{text-align:center;line-height:1.2}
#b-pot{right:238px;bottom:6px;width:48px;height:48px;background:radial-gradient(circle at 50% 35%,#5a2a2a,#1b1111 72%)}
#b-auto{right:166px;bottom:104px;width:54px;height:54px;background:radial-gradient(circle at 50% 35%,#2e3a4a,#11151b 72%);border-color:#566a86;flex-direction:column;gap:0}
#b-auto svg{width:40%;height:40%}
#b-auto .al{position:relative;z-index:1;font:700 10px 'IBM Plex Sans KR';letter-spacing:.05em;margin-top:-2px}
#b-auto.on{border-color:#ffd070;color:#fff2c8;background:radial-gradient(circle at 50% 35%,#6a4a18,#1e1408 72%);box-shadow:0 0 0 3px rgba(255,200,90,.25),0 0 18px rgba(255,170,60,.55)}
#b-auto.on::before{content:'';position:absolute;inset:3px;border-radius:50%;border:2px solid transparent;border-top-color:#ffd070;border-right-color:rgba(255,208,112,.4);animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#autoTag{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:700 12px 'IBM Plex Sans KR';letter-spacing:.2em;color:#ffe2a0;background:rgba(30,20,8,.7);border:1px solid rgba(255,200,90,.5);padding:4px 14px;border-radius:14px;pointer-events:none;animation:pulseT 1.8s ease-in-out infinite}
@media (max-width:640px){#autoTag{bottom:calc(250px + env(safe-area-inset-bottom,0px))}}
#b-pot .cnt{position:absolute;right:4px;bottom:1px;font-size:11px;z-index:5;text-shadow:0 1px 1px #000}
.sk.flash{animation:skf .6s ease 3}
@keyframes skf{50%{box-shadow:0 0 0 6px rgba(220,182,94,.6)}}

.bar.mp{height:8px;background:#0e1a2c;margin-top:2px}
.bar.mp i{background:linear-gradient(#6ab8ff,#2a64b8)}
.bar.mp span{font-size:9px;line-height:8px}
#b-mpot{right:240px;bottom:60px;width:42px;height:42px;background:radial-gradient(circle at 50% 35%,#24406a,#0e1422 72%)}
#b-mpot .cnt{position:absolute;right:3px;bottom:0;font-size:10px;z-index:5;text-shadow:0 1px 1px #000}
#srvNotice{position:absolute;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(720px,calc(100% - 32px));overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,rgba(60,30,6,.2),rgba(80,40,8,.92),rgba(60,30,6,.2));border-top:1px solid #ffd070;border-bottom:1px solid #ffd070;padding:6px 0;pointer-events:none;z-index:3}
#srvNotice b{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;padding:0 10px;background:#b8741a;color:#1a0e04;font-size:11px;z-index:1}
#srvNotice span{display:inline-block;padding-left:100%;font:700 14px 'Gowun Batang',serif;color:#ffe6a0;text-shadow:0 0 8px rgba(255,160,40,.8)}
#srvNotice.run span{animation:marq 9s linear forwards}
@keyframes marq{to{transform:translateX(-100%)}}
.cs-name{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.cs-name span{flex:none}
.stat-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
#bossbar{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(420px,46vw);text-align:center}
#bossbar .bn{font:700 14px 'Gowun Batang',serif;color:#ffb08f;text-shadow:0 1px 2px #000}
#bossbar .bar{height:14px;border-color:#3a0c0a}
#bossbar .bar i{background:linear-gradient(#ff6a3d,#9e1f14)}

#guide{box-sizing:border-box;position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(520px,calc(100% - 32px));background:linear-gradient(rgba(34,26,18,.94),rgba(22,17,14,.94));border:1px solid var(--gold);border-radius:6px;padding:8px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none}
#guide .gl{font-size:10px;letter-spacing:.14em;color:var(--gold);display:block}
#toasts{position:absolute;left:50%;top:34%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:rgba(16,12,12,.88);border:1px solid var(--line2);padding:5px 14px;border-radius:16px;font-size:13px;animation:tin .25s ease both;text-align:center}
.toast.gold{border-color:var(--gold);color:#ffe3a0}
.toast.big{font:700 20px 'Gowun Batang',serif;color:var(--gold);border-color:var(--gold);padding:8px 22px}
.toast.bad{border-color:var(--bad);color:#ffb0a6}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* dialog */
#dlgLayer{position:fixed;inset:0;z-index:20}
#dlg{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 32px));background:linear-gradient(rgba(28,21,22,.96),rgba(16,12,13,.97));border:1px solid var(--line);border-radius:6px;padding:14px 18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#dlg .who{font:700 15px 'Gowun Batang',serif;color:var(--gold);margin-bottom:4px}
#dlg .txt{font:16px/1.65 'Gowun Batang',serif;min-height:3.2em;white-space:pre-wrap}
#dlg .txt em{color:var(--dim);font-style:normal}
#dlg .nx{position:absolute;right:14px;bottom:8px;color:var(--gold);font-size:11px;animation:bob .6s infinite alternate}
#dlg .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{background:linear-gradient(#5a4128,#35251a);border:1px solid var(--line);border-radius:5px;padding:8px 16px;color:#f7e7c4;font-weight:500}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.pri{background:linear-gradient(#c98a3a,#8a5620);border-color:#f0c070;color:#1d130a;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}

/* panels */
#panel{position:fixed;inset:0;z-index:60;background:rgba(6,4,6,.55);display:grid;place-items:center;padding:16px}
.pcard{width:min(640px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;background:linear-gradient(#211918,#151011);border:1px solid var(--line);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.7);overflow:hidden}
.pcard header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2);background:rgba(0,0,0,.25)}
.pcard h2{margin:0;font:700 18px 'Gowun Batang',serif;color:#f5e2b4}
#pbody{overflow:auto;padding:14px 16px 18px}
.sec{margin-bottom:14px}
.pcard.wide{width:min(1000px,100%)}
.invtop{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#f1e3c2;margin-bottom:10px}.invtop span{display:flex;align-items:center;gap:4px}.invtop svg{width:16px;height:16px;color:var(--gold)}
.invgrid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:14px}
@media (max-width:700px){.invgrid{grid-template-columns:1fr}}
.eqwrap{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center}
.eqcol{display:flex;flex-direction:column;gap:6px}
.eslot,.islot{position:relative;width:54px;height:54px;border-radius:7px;border:2px solid #4a3a2c;background:radial-gradient(circle at 50% 35%,#2e2420,#141010 75%);display:grid;place-items:center;color:#e8d8b8;padding:0}
.eslot svg,.islot svg{width:26px;height:26px}.eslot span{font-size:10px;color:#8a7a68}
.r0{border-color:#8a8074}.r1{border-color:#4a9aff;box-shadow:0 0 8px rgba(74,154,255,.35)}.r2{border-color:#ffc83a;box-shadow:0 0 10px rgba(255,200,58,.45)}.r3{border-color:#ff3a2a;box-shadow:0 0 12px rgba(255,58,42,.6);animation:heroic 1.6s ease-in-out infinite}
@keyframes heroic{50%{box-shadow:0 0 18px rgba(255,80,40,.95)}}
.eslot.sel,.islot.sel{outline:2px solid #fff4d0;outline-offset:1px}.islot.no{opacity:.55}.islot.empty{border-style:dashed;border-color:#3a2e26;background:rgba(0,0,0,.2)}
.islot i{position:absolute;font-style:normal;font-size:9px;font-weight:700;text-shadow:0 1px 2px #000}.islot .en,.eslot .en{right:3px;top:1px;color:#ffd070}.islot .lk{left:2px;top:0}.islot .st{left:2px;bottom:1px;color:#ff8a7a}.islot .q{right:3px;bottom:1px;color:#fff}
.prev{position:relative;text-align:center}.prev canvas{width:100%;max-width:220px;aspect-ratio:220/300;background:radial-gradient(circle at 50% 70%,rgba(255,180,90,.18),transparent 65%);border-radius:8px}
.pvname{font:700 13px 'Gowun Batang',serif;color:#f5e2b4;margin-top:-6px}
.stbox{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:rgba(0,0,0,.2);font-size:12px}
.stbox div{display:flex;justify-content:space-between}.stbox .full{grid-column:1/-1}.stbox span{color:var(--dim)}
.setline{margin-top:6px;font-size:12px;color:var(--dim);padding:5px 8px;border-radius:5px;border:1px dashed var(--line2)}.setline.on{color:#ffb0a0;border-color:#a0402a}
.bbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pset{display:inline-flex;gap:2px}
.invtabs{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}.invtabs .tabs{margin:0}.bagc{font-size:12px;color:var(--dim)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,54px);gap:8px;margin-top:8px;max-height:300px;overflow:auto;padding:2px}
#itip{margin-top:10px}.tipc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:linear-gradient(rgba(40,30,26,.95),rgba(20,14,14,.95))}
.tipc.r1{border-color:#4a9aff}.tipc.r2{border-color:#ffc83a}.tipc.r3{border-color:#ff3a2a;box-shadow:0 0 18px rgba(255,58,42,.35)}
.tiph{display:flex;gap:10px;align-items:center}.tiph .ti{width:44px;height:44px;display:grid;place-items:center;border-radius:6px;background:#1b1412;color:var(--gold)}.tiph .ti svg{width:26px;height:26px}
.tn{font:700 16px 'Gowun Batang',serif}.ts{font-size:11px;color:var(--dim)}.tbase{margin:8px 0;font-size:13px}
.tsub{border-top:1px solid var(--line2);padding-top:6px}.tsub .tt{font-size:11px;color:var(--gold);margin-bottom:4px}
.sopt{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 4px;border-radius:4px}.sopt.lk{background:rgba(255,200,90,.12)}.sopt input{accent-color:#ffc84a}
.uq{color:#ff6a5a;font-weight:700}.gr{font-size:10px;padding:0 4px;border-radius:3px;margin-left:2px}.gC{background:#3a4a5a}.gB{background:#2a5a9a}.gA{background:#8a6a1a}.gS{background:#a02a1a}
.setb{margin-top:8px;font-size:12px;border-top:1px solid var(--line2);padding-top:6px}.setb b{color:#ff8a7a}.setb div{color:var(--dim);margin-top:3px}.setb div.on{color:#ffd0c0}
.warnl{color:#ff8a7a;font-size:12px;margin:6px 0 0}.skd{margin-top:12px}.skd summary{cursor:pointer;color:var(--gold);font-size:12px}
.sec h3{margin:0 0 6px;font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:500}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:5px;margin-bottom:6px}
.row .l{min-width:0}
.row .l b{display:block;font-weight:500}
.row .l small{color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.chip{padding:6px 10px;border:1px solid var(--line2);border-radius:5px;background:rgba(255,255,255,.03);font-size:12px;display:flex;justify-content:space-between;gap:6px}
.chip b{font-weight:500;color:#f3e3bb}
.wcard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:6px;background:radial-gradient(circle at 20% 30%,rgba(220,182,94,.12),transparent 60%),rgba(0,0,0,.25)}

(()=>{'use strict';
/* =========================================================

const $=s=>document.querySelector(s);
const V=THREE.Vector3;

function mileGain(lv){return lv<=6?10:lv<=9?7:5}
function tryEnhance(lv,prot){
  const [s,k,d,x]=ENH[lv]; let keep=k,des=x;
  if(prot&&x>0){keep+=x;des=0}
  const r=Math.random()*100; // [0,100)
  if(r<s) return 'success';
  if(r<s+keep) return 'keep';
  if(r<s+keep+d) return 'down';
  return 'destroy';
}

const curQ=()=>QUESTS[S.q];
const curStep=()=>{const q=curQ();return q&&q.steps[S.step];};
function goalActive(k,id){const st=curStep();if(!st||!st.goals)return false;const q=curQ();if(q.zone!==W.zone&&k!=='level'&&k!=='promote')return false;return st.goals.some((g,i)=>g.k===k&&g.id===id&&(S.cnt[i]||0)<g.n);}
function stepCnt(k,id){const st=curStep();if(!st||!st.goals)return 0;const i=st.goals.findIndex(g=>g.k===k&&g.id===id);return i<0?0:(S.cnt[i]||0);}
function progress(k,id,amt){
  const st=curStep();if(!st||!st.goals)return;let ch=false;
  st.goals.forEach((g,i)=>{if(g.k===k&&g.id===id){const c=S.cnt[i]||0;if(c<g.n){S.cnt[i]=Math.min(g.n,c+(amt||1));ch=true;}}});
  if(ch){refreshQuest();$('#qtrack').classList.remove('pulse');void $('#qtrack').offsetWidth;$('#qtrack').classList.add('pulse');
    if(st.goals.every((g,i)=>(S.cnt[i]||0)>=g.n)){P.hunt=null;later(.7,()=>{if(curStep()===st)advance();});}save();}

function hitEnemy(e,mult,o){

function projectile(o){

  const p=Object.assign({t:0,life:o.life||2,hit:new Set()},o,{mesh:m,pos:m.position});
  if(!p.dir){const tp=o.target&&(o.target.pos||o.target);p.dir=tp?new V(tp.x-o.from.x,0,tp.z-o.from.z).normalize():fwd();}W.proj.push(p);return p;

function updProj(dt){
  for(let i=W.proj.length-1;i>=0;i--){const p=W.proj[i];p.t+=dt;let done=p.t>p.life;
    if(!done){
      if(p.homing&&p.target&&!p.target.dead&&!p.target.gone){const tp=p.target.pos||p.target;const to=new V(tp.x-p.pos.x,(p.ty||1)-p.pos.y,tp.z-p.pos.z);const L=to.length();if(L<.5+(p.target.rad||0)*.5){p.onHit&&p.onHit(p.target,p);done=true;}else{to.multiplyScalar(1/L);p.dir=to;}}
      if(!done){p.pos.addScaledVector(p.dir,p.speed*dt);p.mesh.lookAt(p.pos.clone().add(p.dir));if(p.spin)p.mesh.rotateZ(p.t*18);
        if(!p.homing&&p.from0!==false){
          if(p.enemy){if(!P.dead&&d2(p.pos,P.pos)<P.rad+.4){p.onHit&&p.onHit(P,p);done=true;}}
          else for(const e of W.enemies){if(e.dead||p.hit.has(e))continue;if(d2(e.pos,p.pos)<e.rad+.5){p.hit.add(e);p.onHit&&p.onHit(e,p);if(!p.pierce){done=true;break;}}}
        }
        if(p.trail&&Math.random()<.6)burst(p.pos.x,p.pos.y,p.pos.z,p.trail,2,.6,.3,.25,0);
      }
    }
    if(done){p.onEnd&&p.onEnd(p);killObj(p.mesh);W.proj.splice(i,1);}
  }
}

  if(P.chests&&P.chests.length)P.chests=P.chests.filter(c=>{c.t-=dt;if(d2(c.g.position,P.pos)<1.7){P.mp=Math.min(P.maxMp,P.mp+P.maxMp*.1);floatText(P.pos,'+MP 10%','info',2.4);burst(c.g.position.x,.6,c.g.position.z,0xffe080,20,3,.6,.3,2);auCoin();killObj(c.g);return false;}if(c.t<=0){killObj(c.g);return false;}return true;});

}
function stepToward(tx,tz,dt,stopAt){const dx=tx-P.pos.x,dz=tz-P.pos.z,d=Math.hypot(dx,dz);if(d<=stopAt)return false;const s=Math.min(d-stopAt+.01,P.speed*dt);P.pos.x+=dx/d*s;P.pos.z+=dz/d*s;P.face=Math.atan2(dx,dz);resolve(P.pos,P.rad);P.walk+=s*2.3;return true;}

}

    const occ=!e.dead&&(d2(P.pos,e.pos)<8||P.pos.z<e.pos.z+2&&Math.abs(P.pos.x-e.pos.x)<10),f2=p.fade+((occ?.28:1)-p.fade)*Math.min(1,dt*6);

    p.wings.forEach((w,i)=>w.rotation.z=(i?-1:1)*(.15+Math.sin(rt*1.6)*.35));const tgt=Math.atan2(P.pos.x-e.pos.x,P.pos.z-e.pos.z)-e.mesh.rotation.y;p.head.rotation.y=clamp(Math.atan2(Math.sin(tgt),Math.cos(tgt)),-.6,.6);

function updNpcs(dt){

function talkTo(n){

  const st=curStep(),q=curQ();
  n.face=Math.atan2(P.pos.x-n.pos.x,P.pos.z-n.pos.z);
  if(st&&st.talk===n.id&&q.zone===W.zone){
    if(st.cs==='eldric'){csEldric();return;}
    dialog(DLG[st.dlg]).then(()=>{if(st.after)AFTER[st.after]();advance();});return;
  }
  const d=n.d;
  const idle=Array.isArray(d.idle)?d.idle[Math.floor(Math.random()*d.idle.length)]:d.idle;
  if(d.service==='promo'){dialog([[n.id,idle,[{t:S.cls==='novice'?'진급 상담':'길드 · 스킬 안내',fn:()=>openPromo(d.cls,n.id)},{t:SERVICE_LABEL[d.svc],fn:()=>SERVICES[d.svc]()},{t:'대화 종료'}]]]);return;}

  dialog([[n.id,idle]]);
}

function dialog(lines){return new Promise(res=>{if(CS&&CS.skip)return res();if(!lines||!lines.length)return res();DL={lines,i:0,res,typing:null};dlgLayer.hidden=false;showLine();});}
function showLine(){const [w,t,ch]=DL.lines[DL.i];dlgWho.textContent=speakerName(w);dlgCh.innerHTML='';dlgNx.hidden=!!ch;
  const txt=t;let i=0;dlgTxt.innerHTML='';const isAct=w==='P'||/^\(/.test(txt);
  const render=n=>{const s=txt.slice(0,n);dlgTxt.innerHTML='';const parts=s.split(/(\([^)]*\)?)/);parts.forEach(p=>{if(!p)return;if(p[0]==='('){const em=document.createElement('em');em.textContent=p;dlgTxt.appendChild(em);}else dlgTxt.appendChild(document.createTextNode(p));});};

function fade(to,dur){const el=$('#fade');const from=+getComputedStyle(el).opacity;return new Promise(r=>{if(CS&&CS.skip&&to===0){}tween(dur,k=>{el.style.opacity=from+(to-from)*k;},r);});}

/* cutscene wrapper */
async function cutscene(fn){
  if(CS){await fn();return;}
  CS={skip:false};cam.mode='free';document.body.classList.add('cine');$('#skip').hidden=false;
  if(P){P.target=null;P.dest=null;P.hunt=null;}
  try{await fn();}catch(err){console.error(err);}
  finally{CS=null;document.body.classList.remove('cine');$('#skip').hidden=true;caption('');hideChapter();cam.mode='follow';}
}
$('#skip').onclick=()=>{if(!CS)return;CS.skip=true;tasks.forEach(t=>{if(t.cs)t.t=0;});tweens.forEach(w=>{if(w.cs)w.t0=-1e9;});if(DL)closeDialog();};
const paused=()=>!!(DL||panelOpen||CS||transitioning);

/* zone transitions */
let transitioning=false;
async function gotoZone(z,arrive){
  transitioning=true;if(P){P.target=null;P.dest=null;P.hunt=null;}
  await fade(1,.45);
  await needZone(z);
  buildZone(z);S.zone=z;
  const a=arrive||ZONES[z].spawn;P.pos.set(a[0],0,a[1]);if(P.mercLeft>0)spawnMerc();updSetFx();P.face=z==='plains'&&a[1]<0?Math.PI:Math.PI;P.mesh.rotation.y=P.face;
  cam.pos.copy(P.pos).add(CAM_OFF);cam.look.copy(P.pos);
  $('#zname').textContent=ZONES[z].name;
  progress('enter',z);save();refreshQuest();
  toast(ZONES[z].name,'big');
  await fade(0,.5);transitioning=false;
  const st=curStep();if(st&&st.guide)showGuide(st.guide);
}

function refreshQuest(){
  const q=curQ(),st=curStep();
  if(!q){$('#qtitle').textContent='모든 퀘스트 완료';$('#qgoals').innerHTML='';return;}
  $('#qch').textContent=(q.ch||'메인')+' · 메인 퀘스트';$('#qtitle').textContent=q.title;
  const g=$('#qgoals');g.innerHTML='';
  if(!st)return;
  if(st.talk){const d=document.createElement('div');d.innerHTML='<span></span>';d.firstChild.textContent=st.text;g.appendChild(d);}
  else st.goals.forEach((go,i)=>{const d=document.createElement('div');const c=S.cnt[i]||0;if(c>=go.n)d.className='done';d.innerHTML='<span></span><span class="num"></span>';d.firstChild.textContent=go.t;d.lastChild.textContent=go.k==='equip'||go.k==='skill'||go.k==='enter'?(c>=go.n?'완료':''):c+'/'+go.n;g.appendChild(d);});

}

/* minimap */
const mm=$('#mm'),mg=mm.getContext('2d');
function drawMinimap(){
  const R=30,w=mm.width,sc=w/2/R,cx=P.pos.x,cz=P.pos.z;
  mg.fillStyle=W.zone==='citadel'?'#3a3d44':W.zone==='plains'?'#2d3a22':'#2f3522';mg.fillRect(0,0,w,w);
  mg.save();mg.translate(w/2,w/2);
  const b=W.bounds;mg.strokeStyle='rgba(220,182,94,.35)';mg.lineWidth=2;mg.strokeRect((b[0]-cx)*sc,(b[2]-cz)*sc,(b[1]-b[0])*sc,(b[3]-b[2])*sc);
  mg.fillStyle='rgba(10,8,6,.55)';
  for(const c of W.cols){if(c.off)continue;if(Math.abs(c.x-cx)>R+8||Math.abs(c.z-cz)>R+8)continue;if(c.t==='c'){if(c.r<.5)continue;mg.beginPath();mg.arc((c.x-cx)*sc,(c.z-cz)*sc,c.r*sc,0,7);mg.fill();}else mg.fillRect((c.x-c.hw-cx)*sc,(c.z-c.hd-cz)*sc,c.hw*2*sc,c.hd*2*sc);}
  W.portals.forEach(p=>{mg.fillStyle=p.unlocked()?'#6ac8ff':'#6a5a5a';mg.beginPath();mg.arc((p.x-cx)*sc,(p.z-cz)*sc,5,0,7);mg.fill();});
  W.npcs.forEach(n=>{if(n.wander){mg.fillStyle='#9fd0ff';mg.fillRect((n.pos.x-cx)*sc-2,(n.pos.z-cz)*sc-2,4,4);return;}mg.fillStyle='#f6e2a8';mg.beginPath();mg.arc((n.pos.x-cx)*sc,(n.pos.z-cz)*sc,3.5,0,7);mg.fill();});
  W.enemies.forEach(e=>{if(e.dead)return;mg.fillStyle=e.d.boss?'#ff6a3a':e.d.static||e.d.dummy?'#c8a060':'#e0453a';const r=e.d.boss?6:3.5;mg.beginPath();mg.arc((e.pos.x-cx)*sc,(e.pos.z-cz)*sc,r,0,7);mg.fill();});
  const o=objective();if(o){let x=(o.x-cx)*sc,z=(o.z-cz)*sc;const L=Math.hypot(x,z),mx=w/2-12;if(L>mx){x=x/L*mx;z=z/L*mx;}
    mg.fillStyle='#ffd35a';mg.strokeStyle='#000';mg.lineWidth=2;mg.beginPath();for(let i=0;i<10;i++){const a=i/10*6.283-Math.PI/2,r=i%2?4:9;mg.lineTo(x+Math.cos(a)*r,z+Math.sin(a)*r);}mg.closePath();mg.stroke();mg.fill();}
  mg.rotate(P.mesh.rotation.y*-1+Math.PI);mg.fillStyle='#fff';mg.beginPath();mg.moveTo(0,-9);mg.lineTo(6,6);mg.lineTo(0,3);mg.lineTo(-6,6);mg.closePath();mg.fill();
  mg.restore();
}

    const r=new THREE.Mesh(new THREE.RingGeometry(1,1.25,32),new THREE.MeshBasicMaterial({color:0xffd070,transparent:true,opacity:.7,side:THREE.DoubleSide,depthWrite:false}));r.rotation.x=-Math.PI/2;r.position.y=.08;beacon.add(r);beacon.userData.r=r;scene.add(beacon);}

function doEnhance(){
  const w=S.weapon;if(w.destroyed||w.enh>=15)return;
  const [s,k,d,x,g,st,sn]=ENH[w.enh];if(S.gold<g||S.stones[st]<sn)return;
  S.gold-=g;S.stones[st]-=sn;
  const guar=S.mileage>=100;const prot=x>0&&enhProt&&S.scrolls>0&&!guar;if(prot)S.scrolls--;
  const r=guar?'success':tryEnhance(w.enh,prot);const lv=w.enh;let msg;
  if(r==='success'){w.enh++;if(guar)S.mileage=0;msg='<span style="color:var(--ok)">강화 성공! +'+w.enh+' '+w.name+(guar?' (마일리지 확정 성공)':'')+'</span>';burst(P.pos.x,1.5,P.pos.z,0xffd070,30,4,1,.4,1);}
  else if(r==='keep'){S.mileage=Math.min(100,S.mileage+mileGain(lv));msg='<span style="color:#d8cfbf">강화 실패. 수치는 유지됩니다.</span>';}
  else if(r==='down'){w.enh--;S.mileage=Math.min(100,S.mileage+mileGain(lv));msg='<span style="color:var(--warn)">강화 실패. 강화 단계가 1 하락합니다. (+'+w.enh+')</span>';}
  else{w.destroyed=true;S.shards+=SHARD_NEED;S.mileage=Math.min(100,S.mileage+mileGain(lv));msg='<span style="color:var(--bad)">장비가 파괴되었습니다... 장비의 파편 ×'+SHARD_NEED+' 획득</span>';shake(.3);}
  if(prot&&r!=='success')msg+='<div class="note">보호의 주문서가 파괴를 막았습니다.</div>';
  recalc();setWeaponModel();refreshHud();save();renderEnh(msg);
}

function autoWanted(){
  const q=curQ(),st=curStep(),w=new Set();if(!q||!st||!st.goals||q.zone!==W.zone)return w;
  st.goals.forEach((g,i)=>{if((S.cnt[i]||0)>=g.n)return;if(g.k==='kill'){if(g.id==='raider'){w.add('raider');w.add('slinger');}else w.add(g.id);}
    if(g.k==='item'){w.add('raider');w.add('slinger');}if(g.k==='destroy')w.add(g.id);if(g.k==='skill')w.add('scarecrow');});
  return w;
}
function autoPick(){
  const want=autoWanted();let best=null,bs=1e9;
  for(const e of W.enemies){if(e.dead||e.gone)continue;const q=want.has(e.type)||(e.d.tag&&want.has(e.d.tag));
    if((e.d.static||e.d.dummy)&&!q)continue;const d=d2(e.pos,P.pos);if(d>(q?26:18))continue;
    const sc=d-(q?7:0)-(e.aggro?9:0)-(e.d.ranged?2:0);if(sc<bs){bs=sc;best=e;}}
  return best;
}
function inTele(g){const u=g.userData,dx=P.pos.x-g.position.x,dz=P.pos.z-g.position.z;
  if(u.kind==='c'){const d=Math.hypot(dx,dz);return d<u.r+P.rad+.2?{x:g.position.x+(d>.01?dx/d:1)*(u.r+1.8),z:g.position.z+(d>.01?dz/d:0)*(u.r+1.8)}:null;}
  const a=g.rotation.y,fx=Math.sin(a),fz=Math.cos(a),along=dx*fx+dz*fz,side=dx*fz-dz*fx;
  if(along>-.5&&along<u.len+.5&&Math.abs(side)<u.w/2+P.rad+.2){const sgn=side>=0?1:-1;return{x:P.pos.x+fz*sgn*(u.w/2+1.8-Math.abs(side)),z:P.pos.z-fx*sgn*(u.w/2+1.8-Math.abs(side))};}
  return null;

  toast('새 퀘스트 · '+curQ().title);startStep(false);
}

/* hot-reload friendliness: keep progress when the page is updated */
addEventListener('pagehide',save);
showTitle();
loadHeroes(p=>updTitleStatus(p)).then(ok=>{kitReady=true;if(!ok)console.warn('KayKit assets unavailable — using built-in models');if(W.zone==='title'&&ok&&!titleBusy){buildZone('title');}updTitleStatus(1);});
})();
</script>
