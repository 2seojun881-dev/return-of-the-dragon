<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
 <linearGradient id="pt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a8f9e"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#a8adbb"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#e0b050"/><stop offset="1" stop-color="#8a6010"/></linearGradient>
 <radialGradient id="orb" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#a8e4ff"/><stop offset=".75" stop-color="#2a7ad8"/><stop offset="1" stop-color="#0a2a6a"/></radialGradient>
 <filter id="aura" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<circle cx="128" cy="50" r="42" fill="#8ad0ff" opacity=".5" filter="url(#aura)"/>
<g filter="url(#sh)">
 <!-- shaft -->
 <rect x="122" y="92" width="12" height="150" rx="5" fill="url(#pt)" stroke="#6a6f7e" stroke-width="1.5"/>
 <rect x="119" y="150" width="18" height="10" rx="3" fill="url(#gold)"/><rect x="119" y="200" width="18" height="8" rx="3" fill="url(#gold)"/>
 <path d="M122 238 L134 238 L128 252 Z" fill="url(#gold)"/>
 <!-- crown / wings -->
 <path d="M128 86 C104 88 92 72 96 58 C104 70 116 74 124 74 Z M128 86 C152 88 164 72 160 58 C152 70 140 74 132 74 Z" fill="url(#gold)" stroke="#7a5410" stroke-width="1.5"/>
 <path d="M116 100 Q128 80 140 100 Z" fill="url(#gold)" stroke="#7a5410" stroke-width="1.5"/>
</g>
<!-- rune rings -->
<ellipse cx="128" cy="50" rx="44" ry="13" fill="none" stroke="#ffd870" stroke-width="3" filter="url(#glow)" transform="rotate(-14 128 50)"/>
<ellipse cx="128" cy="50" rx="38" ry="38" fill="none" stroke="#ffe8a0" stroke-width="1.5" stroke-dasharray="4 5" opacity=".8"/>
<!-- floating orb -->
<circle cx="128" cy="50" r="23" fill="url(#orb)" stroke="#dff4ff" stroke-width="1.5"/>
<ellipse cx="119" cy="41" rx="7" ry="4.5" fill="#fff" opacity=".85"/>
<path d="M128 22 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#fff" filter="url(#glow)" transform="translate(28 -6)"/>
</svg>
