<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
 <linearGradient id="lt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3444"/><stop offset=".5" stop-color="#18141e"/><stop offset="1" stop-color="#08060c"/></linearGradient>
 <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1640"/><stop offset="1" stop-color="#0c0614"/></linearGradient>
 <pattern id="chain" width="7" height="6" patternUnits="userSpaceOnUse"><ellipse cx="3.5" cy="3" rx="3" ry="2.2" fill="none" stroke="#8a8f9a" stroke-width="1.2"/></pattern>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".6"/></filter>
</defs>
<g filter="url(#sh)">
 <!-- cape behind -->
 <path d="M60 60 Q40 150 52 240 L96 222 L128 244 L160 222 L204 240 Q216 150 196 60 Z" fill="url(#cape)" stroke="#05030a" stroke-width="3"/>
 <!-- hood -->
 <path d="M84 70 Q86 18 128 12 Q170 18 172 70 Q150 50 128 50 Q106 50 84 70 Z" fill="url(#cape)" stroke="#05030a" stroke-width="3"/>
 <path d="M96 64 Q128 40 160 64" fill="none" stroke="#6ae0ff" stroke-width="1.6" stroke-dasharray="4 3"/>
 <!-- chainmail underlayer -->
 <path d="M84 70 L172 70 L168 188 L88 188 Z" fill="#2a2d34"/><path d="M84 70 L172 70 L168 188 L88 188 Z" fill="url(#chain)"/>
 <!-- leather vest with crossing straps -->
 <path d="M80 72 Q104 64 118 80 L112 196 Q94 198 84 188 Z" fill="url(#lt)" stroke="#05030a" stroke-width="2.5"/>
 <path d="M176 72 Q152 64 138 80 L144 196 Q162 198 172 188 Z" fill="url(#lt)" stroke="#05030a" stroke-width="2.5"/>
 <path d="M86 84 L168 170 M170 84 L88 170" stroke="#3a2418" stroke-width="7"/>
 <path d="M86 84 L168 170 M170 84 L88 170" stroke="#6ae0ff" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
 <circle cx="128" cy="127" r="7" fill="#9a4aff" stroke="#1a0a2a" stroke-width="2" filter="url(#glow)"/>
 <!-- stitched seams -->
 <path d="M114 84 L110 190 M142 84 L146 190" stroke="#6ae0ff" stroke-width="1.2" stroke-dasharray="3 3"/>
 <!-- shoulder guards with shadow daggers -->
 <path d="M58 72 Q70 58 92 66 L90 92 Q70 84 56 94 Z" fill="url(#lt)" stroke="#05030a" stroke-width="2.5"/>
 <path d="M198 72 Q186 58 164 66 L166 92 Q186 84 200 94 Z" fill="url(#lt)" stroke="#05030a" stroke-width="2.5"/>
 <path d="M66 70 L60 50 L70 68 Z M190 70 L196 50 L186 68 Z" fill="#b8b0d8" stroke="#2a2040"/>
 <!-- belt + dagger holsters -->
 <rect x="84" y="176" width="88" height="14" rx="3" fill="#3a2418" stroke="#05030a" stroke-width="2"/>
 <rect x="120" y="174" width="16" height="18" rx="2" fill="#8a8f9a" stroke="#2a2d34" stroke-width="2"/>
 <path d="M92 190 L100 226 L108 190 Z M148 190 L156 226 L164 190 Z" fill="#2a1a14" stroke="#05030a" stroke-width="2"/>
 <path d="M100 190 L100 180 M156 190 L156 180" stroke="#c070ff" stroke-width="3" filter="url(#glow)"/>
</g>
</svg>
