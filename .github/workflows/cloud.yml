# return-of-the-dragon 저장소의 .github/workflows/cloud.yml 로 들어가는 배포 작업
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: 계정 서버 배포 (Cloudflare)
on:
  push:
    branches: [main]
    paths: ['cloud/**', '.github/workflows/cloud.yml']
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler@4
      - name: D1 데이터베이스 준비 (없으면 만들기)
        run: |
          ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="rotd") | .uuid')
          if [ -z "$ID" ]; then wrangler d1 create rotd; ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="rotd") | .uuid'); fi
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
      - name: 테이블 만들기
        run: wrangler d1 migrations apply rotd --remote
      - name: 배포
        run: wrangler deploy
      - name: 확인
        run: sleep 20 && curl -fsS -X POST https://api.faceforking.com/health
